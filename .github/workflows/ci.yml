name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Early warning on Bumpy's version PR: the same gate release.yml enforces before publishing, run
  # while there is still a PR to fix rather than after the merge that triggers the release.
  release-gate:
    name: Release gate
    if: github.event.pull_request.head.ref == 'bumpy/version-packages'
    uses: ./.github/workflows/full-test.yml

  # The E2E suite runs alongside the gate rather than inside it: it needs a different provisioning set
  # (VS Code, both bundles, a virtual display) and no Playwright browser, so folding it into
  # full-test.yml would make each job pay for the other's setup.
  release-gate-e2e:
    name: Release gate (E2E)
    if: github.event.pull_request.head.ref == 'bumpy/version-packages'
    uses: ./.github/workflows/e2e.yml

  # The Publish job's own steps, on the version PR, with nothing published (audit I-10, I-11). Tests
  # never ran them: the dictionary check, the provisioning, the per-platform packaging, the publish
  # script. So each broke for the first time AFTER the merge, in the Publish job, when the release
  # was already under way. Here a broken step fails while there is still a PR to fix. Same order as
  # release.yml; no tokens, because nothing is uploaded.
  release-gate-package:
    name: Release gate (packaging)
    if: github.event.pull_request.head.ref == 'bumpy/version-packages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24.22"
          cache: true

      # Red until the data workflow has published this schema's dictionary — which is the point:
      # merging before then would ship a version whose first run cannot download anything.
      - name: Verify dictionary artifacts exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp exec node scripts/check-data-release.ts

      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      # The oniguruma WASM, then the host and webview bundles, then one .vsix per platform — what
      # Bumpy's `buildCommand` runs in the Publish job, after release.yml provisions the WASM.
      - name: Build every platform package
        run: vp run build:platforms

      # Checks the packages, the publishing CLIs and what the Marketplace already has, then prints the
      # commands the Publish job would run.
      - name: Publish (dry run)
        run: vp exec node scripts/publish-vsix.ts --dry-run

  ci:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to the Node that VSCode's extension host actually runs, NOT a matrix.
      #
      # This is an extension, not a library: the only Node that ever executes `src/host/**` is the
      # one Electron embeds, which `engines.vscode` fixes exactly (^1.123 -> Electron 42 -> Node
      # 24.15). Testing other majors asserted against environments no user has, and it actively
      # blocked correct work — the matrix went red on `RegExp.escape` (Node 24+) even though every
      # supported VSCode has it.
      #
      # Raise this in lockstep with `engines.vscode`. VSCode has never shipped Node 26, so 24 is
      # both the floor and the ceiling today.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24.22"
          cache: true

      # The `component` Vitest project runs every rendering spec in real Chromium — jsdom is gone (see
      # docs/POLISH-PLAN.md), so the binary is a build requirement rather than an optional extra.
      # A missing browser does FAIL the run (verified: `vp test` exits 1 with an unhandled
      # browserType.launch error) — an earlier version of this comment claimed it exited 0, which was
      # a measurement mistake from piping the command through `tail` and reading tail's exit code.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(vp exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved version: a Playwright bump must miss the cache, or the restored
      # browser would no longer match the client that drives it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # `--with-deps` on a miss: the runner needs Chromium's shared libraries too, and installing
      # them is what a bare `playwright install` leaves out.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install --with-deps chromium

      - run: vp check

      # The tokenizer loads IPADIC from a directory at runtime, so the corpus, spacing, furigana and
      # tokenizer specs cannot run without it. It is a gitignored build artifact (~16MB from GitHub's
      # own CDN), which is why it is provisioned here rather than committed.
      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      # The host bundle, so `scripts/__tests__/packaging.spec.ts` has something to inspect. That
      # spec checks the bundle requires nothing the extension host cannot resolve — the failure that
      # shipped 0.2.0 unable to activate — and it can only ask that question of a built artifact.
      - name: Build the extension host bundle
        run: vp run build:onig-wasm && vp pack

      - run: vp test

  # Structural findings — megamorphic inline caches, deopt loops, hidden-class churn — in the four
  # bounded workloads (`bench/*.bench.mjs`), against the baselines committed in `.deopt/baselines/`.
  # Throughput depends on the machine, so it cannot gate; these depend on the code, so they can
  # (bench/README.md). A new finding fails here. Accept one that is expected with
  # `vp exec deoptkit ci --update --out-dir .deopt <workload>`, and commit the baseline.
  deopt:
    name: Deopt findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node 26, not the host's 24.22: the workloads cannot run on Node 24 at all. The bundle they
      # load includes the handwriting recognizer, whose patterns decode with `Uint8Array.fromBase64`
      # (Chromium 148 and Node 25+ only). That code runs in the webview, whose V8 is nearer Node
      # 26's than Node 24's, and the baselines were recorded on Node 26.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true

      # The editor-commands workload tokenizes.
      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      - name: Build the bench bundle
        run: vp run bench:build

      # Every workload, then fail: one finding should not hide another.
      - name: Compare with the baselines
        run: |
          status=0
          for workload in deinflect recognize editorCommands examples; do
            vp exec deoptkit ci --out-dir .deopt "bench/$workload.bench.mjs" || status=1
          done
          exit $status
