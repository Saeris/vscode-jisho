name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Early warning on Bumpy's version PR: the same gate release.yml enforces before publishing, run
  # while there is still a PR to fix rather than after the merge that triggers the release.
  release-gate:
    name: Release gate
    if: github.event.pull_request.head.ref == 'bumpy/version-packages'
    uses: ./.github/workflows/full-test.yml

  # The E2E suite runs alongside the gate rather than inside it: it needs a different provisioning set
  # (VS Code, both bundles, a virtual display) and no Playwright browser, so folding it into
  # full-test.yml would make each job pay for the other's setup.
  release-gate-e2e:
    name: Release gate (E2E)
    if: github.event.pull_request.head.ref == 'bumpy/version-packages'
    uses: ./.github/workflows/e2e.yml

  ci:
    name: Check & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Active LTS and Current track the Node release calendar automatically.
        # Previous LTS is pinned; bump it once per year when a new even-numbered
        # Node major reaches LTS status.
        node-version: ["22", "lts", "latest"]
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      # The `component` Vitest project runs every rendering spec in real Chromium — jsdom is gone (see
      # docs/POLISH-PLAN.md), so the binary is a build requirement rather than an optional extra.
      # A missing browser does FAIL the run (verified: `vp test` exits 1 with an unhandled
      # browserType.launch error) — an earlier version of this comment claimed it exited 0, which was
      # a measurement mistake from piping the command through `tail` and reading tail's exit code.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(vp exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved version: a Playwright bump must miss the cache, or the restored
      # browser would no longer match the client that drives it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # `--with-deps` on a miss: the runner needs Chromium's shared libraries too, and installing
      # them is what a bare `playwright install` leaves out.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install --with-deps chromium

      - run: vp check

      # The tokenizer loads IPADIC from a directory at runtime, so the corpus, spacing, furigana and
      # tokenizer specs cannot run without it. It is a gitignored build artifact (~16MB from GitHub's
      # own CDN), which is why it is provisioned here rather than committed.
      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      - run: vp test
