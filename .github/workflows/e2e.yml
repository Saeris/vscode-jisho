name: E2E

# The end-to-end suite drives a REAL VS Code with the extension loaded, so it is the only layer that
# proves activation, the webview bridge, hovers, editor commands and navigation persistence actually
# work in the product rather than in a test double. It had never run in CI.
#
# Kept out of the per-push path deliberately: it downloads VS Code (~224MB), builds both bundles, and
# takes ~45s of wall clock on top of that. It runs where it decides something — on Bumpy's version PR
# and before a publish — matching the reasoning behind full-test.yml.
on:
  workflow_call:
  # Runnable on demand, so the suite can be exercised without staging a release.
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end (real VS Code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The Node VSCode's extension host runs (see ci.yml). This suite drives a real VSCode, so the
      # host bundle it builds has to target that runtime.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.15"
          cache: true

      # NO Playwright browser install. The harness attaches to VS Code's OWN Chromium over CDP
      # (see e2e/launch.ts), so the ~300MB browser download the Vitest component project needs is
      # pure waste here.
      #
      # Cached on the pinned VS Code version, which is the version launch.ts refuses to float:
      # "PINNED, not 'stable'" — a release that silently swapped the binary would turn this suite red
      # with no code change.
      - name: Read the pinned VS Code version
        id: vscode
        run: |
          version=$(grep -oE 'VSCODE_VERSION = "[^"]+"' e2e/launch.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-${{ steps.vscode.outputs.version }}

      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      # The regex engine behind comment highlighting (spec 18). `vscode-oniguruma` ships the .wasm
      # but does not embed it, so bundling the JS does not bring it along — it is copied into
      # assets/ and read at runtime like the tokenizer dictionary and the stroke SVGs. Gitignored,
      # so a runner has nothing until this runs, and without it the feature degrades silently to
      # "no comments" rather than failing loudly.
      - name: Provision the oniguruma WASM
        run: vp run build:onig-wasm

      # The E2E asserts real dictionary results (searching 食べる returns "to eat"), so it needs a
      # real database — the extension resolves assets/jisho.db directly under
      # --extensionDevelopmentPath rather than downloading one.
      #
      # Cached on the inputs that decide its CONTENTS: the schema, the build script, and the SQL.
      # Measured at 35s, against a 69s test run, so it was a third of this job for a database that
      # is byte-identical whenever those files are unchanged. A key miss rebuilds as before.
      #
      # The key deliberately does NOT cover upstream JMdict, which the build fetches at `latest` and
      # which moves on its own. So a cache hit can serve a database built from older upstream data —
      # acceptable here because these tests assert BEHAVIOUR (食べる resolves, a particle is tagged),
      # not that the corpus is current. The release path rebuilds from scratch and is where upstream
      # freshness actually matters.
      - name: Cache the dictionary database
        id: db-cache
        uses: actions/cache@v4
        with:
          path: |
            assets/jisho.db
            assets/jisho.db.version
          key: jisho-db-common-${{ hashFiles('src/shared/schema.ts', 'scripts/build-data.ts', 'src/data/**') }}

      - name: Build the dictionary database
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: vp run build:data

      - name: Build the extension and webview
        run: vp pack && vp build

      # VS Code draws a real window — there is no headless mode for the workbench — so a Linux runner
      # needs a virtual display. xvfb-run is the same approach VS Code's own extension CI uses.
      - name: Run the E2E suite
        run: xvfb-run -a vp exec playwright test

      # Screenshots and traces are the whole point of a failed E2E run; without them a red CI tells
      # you only that something was not visible.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: test-results/
          retention-days: 7

  # macOS, for the suites that CANNOT be verified anywhere else.
  #
  # #4 (Cmd+A selects nothing) and #7 (Cmd+V pastes nothing) were both macOS-only, and both were
  # shipped to users because the Windows and Linux dev loop cannot reproduce them: the native
  # behaviour still works there, so the tests pass with the fix REMOVED. That is stated in those
  # tests' own comments, and it is the gap this job closes.
  #
  # Deliberately NOT the whole suite. A macOS runner costs 10x a Linux one, and everything except
  # the platform-specific clipboard and selection behaviour is already covered above. If a third
  # macOS-only bug turns up, add its spec here rather than widening this to `playwright test`.
  e2e-macos:
    name: End-to-end (macOS clipboard and selection)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.15"
          cache: true

      - name: Read the pinned VS Code version
        id: vscode
        run: |
          version=$(grep -oE 'VSCODE_VERSION = "[^"]+"' e2e/launch.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-${{ steps.vscode.outputs.version }}

      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      - name: Provision the oniguruma WASM
        run: vp run build:onig-wasm

      - name: Cache the dictionary database
        id: db-cache
        uses: actions/cache@v4
        with:
          path: |
            assets/jisho.db
            assets/jisho.db.version
          key: jisho-db-common-${{ hashFiles('src/shared/schema.ts', 'scripts/build-data.ts', 'src/data/**') }}

      - name: Build the dictionary database
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: vp run build:data

      - name: Build the extension and webview
        run: vp pack && vp build

      # No xvfb: macOS runners have a real window server, so VS Code draws without help.
      #
      # `breakdown` is included for its select-all and paste cases, which are #4 and #7 seen from
      # the other side. It carries other cases too, and running them twice is cheaper than splitting
      # the file to avoid it.
      - name: Run the clipboard and selection suites
        run: vp exec playwright test e2e/clipboard.e2e.ts e2e/breakdown.e2e.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-macos-failure-artifacts
          path: test-results/
          retention-days: 7
