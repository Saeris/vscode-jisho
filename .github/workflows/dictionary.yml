name: Dictionary Data

# Builds the full dictionary databases from source and publishes them to the GitHub Release of their
# schema (`dictionary-v7`), which installed extensions download on first run (spec 05).
#
# Triggered on a SCHEMA change (not a schedule): the extension only accepts a DB whose schema it can
# read, so a schema edit that ships without a rebuilt artifact would break every install. Also
# runnable manually to refresh the data after an upstream dictionary update.
on:
  push:
    branches: [main]
    paths:
      - "src/data/**.sql"
      - "src/shared/schema.ts"
      - "scripts/build-data.ts"
  workflow_dispatch:

# One data publish at a time — concurrent uploads to the same release race on the asset swap.
concurrency: dictionary-release

permissions:
  contents: write

jobs:
  build:
    name: Build & publish dictionary
    # Never run the publish flow from a fork.
    if: github.repository == 'Saeris/vscode-jisho'
    runs-on: ubuntu-latest
    env:
      # The full build holds parsed JSON in memory, but measured peak RSS is only ~2 GB (verified at a
      # 2 GiB heap cap — no OOM, no GC thrashing). 4 GiB is 2× that: honest headroom over the real
      # requirement, well under the runner's 16 GB. Streaming was assessed and declined — see spec 05.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "lts"
          cache: true

      # The data build TOKENIZES (the user dictionary is generated from JMdict), so it needs the
      # compiled IPADIC at assets/lindera-ipadic. Missing it fails with "Dictionary path does not
      # exist", which is how this workflow broke on 2026-08-03 and stayed broken through the schema
      # bump to v6 — leaving the published dictionary at a schema the extension would reject. The
      # e2e and full-test workflows provision it the same way; this one had been the odd one out.
      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      # Word DB (~218k entries) → assets/jisho.db + the jisho-full.db.zst trio (.zst, .sha256,
      # .version). Then the names DB (~743k JMnedict entries) → its own jisho-names.db.zst trio.
      - name: Build full word dictionary
        run: vp run build:data:full

      - name: Build names dictionary
        run: vp run build:data:names

      # Re-open each built DB and assert it answers, its schema version matches, and the compressed
      # artifact matches its checksum sidecar. A corrupt artifact silently breaks every new install,
      # so fail the publish here rather than shipping it.
      - name: Verify word dictionary
        run: vp exec node scripts/verify-db.ts assets/jisho.db --zst assets/jisho-full.db.zst

      - name: Verify names dictionary
        run: vp exec node scripts/verify-db.ts assets/jisho-names.db --zst assets/jisho-names.db.zst --names

      # Which tags to publish to: this schema's own (`dictionary-v7`), and `dictionary-latest` only
      # for schema 6. Every version published before schema 7 (0.1 to 0.3) downloads that one tag
      # and requires schema 6 exactly, so another schema there would break every installed copy
      # (docs/HARDENING-PLAN.md, H-3 and H-8). Read from the BUILT artifact's sidecar, which is what
      # installs will read; fails on a schema this checkout does not build.
      - name: Choose the release tags
        id: tags
        run: |
          set -euo pipefail
          tags=$(vp exec node scripts/release-tags.ts assets/jisho-full.db.zst.version)
          echo "tags=$(echo $tags)" >> "$GITHUB_OUTPUT"
          echo "Publishing to: $tags"

      # Upload the checksum + version sidecars FIRST and the large `.zst` archives LAST: the client
      # fetches `.sha256`/`.version` before the archive, so uploading the archive before its checksum
      # would leave a window where a mid-publish download fails verification. `--clobber` replaces
      # the existing assets; a release is created if absent, with `--latest=false` so a data release
      # never takes the "Latest" badge from the extension's own release.
      - name: Publish the dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --latest=false \
                --title "Dictionary data ($tag)" \
                --notes "JMdict/JMnedict databases downloaded by the extension on first run."

            # Sidecars first (small), archives last (large) — see the note above.
            gh release upload "$tag" --clobber \
              assets/jisho-full.db.zst.sha256 assets/jisho-full.db.zst.version \
              assets/jisho-common.db.zst.sha256 assets/jisho-common.db.zst.version \
              assets/jisho-names.db.zst.sha256 assets/jisho-names.db.zst.version
            gh release upload "$tag" --clobber \
              assets/jisho-full.db.zst \
              assets/jisho-common.db.zst \
              assets/jisho-names.db.zst

            # Refresh the notes so the Releases tab says WHEN these assets were built.
            #
            # The tag is created once and its assets are swapped in place, so the date GitHub shows
            # is the tag's CREATION date and never moves. That is actively misleading — a dictionary
            # rebuilt an hour ago still reads as weeks old, which is exactly how a successful rebuild
            # got mistaken for a failed one.
            #
            # Written to a file rather than a heredoc: the notes need column-0 lines (four+ leading
            # spaces would render the table as a code block), and neither spaces nor tabs can start a
            # line inside a YAML block scalar. `--notes-file` sidesteps the quoting entirely.
            {
              echo "JMdict/JMnedict databases downloaded by the extension on first run."
              echo "Refreshed in place when the data changes; a schema change publishes to a new tag."
              echo
              echo "**The tag date above is when this release was first created, not when these files were built.**"
              echo
              echo "| Asset | Version |"
              echo "| --- | --- |"
              echo "| Word dictionary | \`$(cat assets/jisho-full.db.zst.version)\` |"
              echo "| Common dictionary (tests, contributors) | \`$(cat assets/jisho-common.db.zst.version)\` |"
              echo "| Names dictionary | \`$(cat assets/jisho-names.db.zst.version)\` |"
            } > /tmp/dictionary-notes.md
            gh release edit "$tag" --notes-file /tmp/dictionary-notes.md
          done
