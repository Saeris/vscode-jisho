name: Full Test

# The suite as it exists with real data provisioned. Kept out of the per-push path because building
# the dictionary costs ~60s and five external hosts, and run where it actually decides something:
# before a publish, and on the version PR that precedes one.
#
# Without assets/jisho.db the db/accuracy/names specs SKIP rather than fail (existsSync gates), so a
# run without this provisioning reports green having never exercised search ranking or match
# accuracy at all — the gates CONVENTIONS.md names for ranking-sensitive changes.
on:
  workflow_call:
  # Runnable on demand, so the gate can be exercised without staging a release.
  workflow_dispatch:

jobs:
  full-test:
    name: Test with provisioned data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The Node VSCode's extension host runs (see ci.yml).
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24.15"
          cache: true

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(vp exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install --with-deps chromium

      # Same reason as e2e.yml: the runner has no CJK font, and the component tests render Japanese
      # in a real Chromium. `PitchAccent.spec.tsx` measures geometry over kana, so without this it
      # was measuring tofu boxes rather than the glyphs a reader sees.
      #
      # Backgrounded: this is an apt download, and the database work below neither needs a font nor
      # competes with one for CPU. Only `vp test` renders anything, so the wait sits there. Measured
      # on the last release run: 12s of a 76s job spent waiting on apt with the runner otherwise
      # idle.
      - name: Install CJK fonts
        id: cjk-fonts
        background: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      # Same cache as e2e.yml, same key — the two jobs build the identical database, so whichever
      # runs first populates it for the other. See that file for why upstream JMdict is left out of
      # the key.
      - name: Cache the dictionary database
        id: db-cache
        uses: actions/cache@v4
        with:
          path: |
            assets/jisho.db
            assets/jisho.db.version
          key: jisho-db-common-${{ hashFiles('src/shared/schema.ts', 'scripts/build-data.ts', 'src/data/**') }}

      - name: Build the dictionary database
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: vp run build:data

      # NamesDictionary's only coverage is names.spec, which skips without this. --no-archive drops
      # the zstd release asset: compressing 409MB at level 19 takes longer than building it, and
      # nothing here consumes the archive. Measured: ~50s to build, ~120s to compress.
      # Backgrounded for the same reason: 25s of the 76s job, and nothing between here and the
      # verify step reads this database. It is the single longest step in the job.
      - name: Build the names database
        id: names-db
        background: true
        run: vp exec node scripts/build-data.ts --names --no-archive

      # A half-built DB would leave the specs skipping and this job green, so assert both artifacts
      # answer before trusting a run that depends on them.
      # Everything backgrounded above must have landed before the suite reads it.
      - name: Wait for the fonts and the names database
        wait: [cjk-fonts, names-db]

      - name: Verify the databases
        run: |
          vp exec node scripts/verify-db.ts assets/jisho.db
          vp exec node scripts/verify-db.ts assets/jisho-names.db --names

      - run: vp test
