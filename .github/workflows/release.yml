name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Lets the publish job mint an OIDC ID token, which is how Open VSX trusted publishing works:
  # `ovsx` exchanges it for a short-lived publishing token instead of using a stored secret. It is
  # granted now so retiring OVSX_PAT later is a secret deletion rather than a workflow change —
  # `ovsx` prefers a PAT when one is set and falls back to OIDC on its own when it is not.
  id-token: write

jobs:
  # `main` is unprotected and this workflow runs on push, so a red check on the version PR informs
  # but does not prevent anything — the publish would proceed the moment it merges. Running the gate
  # here makes it mechanical: `needs` holds the publish until the suite passes against real data.
  gate:
    if: github.repository == 'Saeris/vscode-jisho'
    uses: ./.github/workflows/full-test.yml

  # Publishing without ever having driven the real product would mean the extension's activation,
  # webview bridge and editor commands were last verified on someone's laptop.
  gate-e2e:
    if: github.repository == 'Saeris/vscode-jisho'
    uses: ./.github/workflows/e2e.yml

  release:
    name: Publish
    # Guard against forks running the publish flow.
    if: github.repository == 'Saeris/vscode-jisho'
    needs: [gate, gate-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The Node VSCode's extension host runs (see ci.yml). This job packages the code that ships,
      # so it must build against the runtime that will execute it.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24.22"
          cache: true

      # Bumpy publishes a version that has no `<name>@<version>` tag yet (its rule for a package with
      # a custom publishCommand). Any other push to main only updates the version PR.
      - name: Is a version waiting to be published?
        id: pending
        run: |
          tag="$(vp exec node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published; this push only updates the version PR."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Release precondition: the extension downloads its dictionary from its schema's release
      # (`dictionary-v7`) on first run, so refuse to publish a .vsix whose required
      # artifacts don't exist yet — otherwise every new install gets a broken first run. The data
      # workflow (dictionary.yml) publishes those artifacts on a schema change; this gate makes the
      # ordering a hard precondition rather than a race.
      #
      # Only when a version is waiting to be published. A push that changes the schema starts this
      # workflow and the data workflow together, so that push failed here while its data was still
      # building (2026-11-10, schema 7), although it published nothing.
      - name: Verify dictionary artifacts exist
        if: steps.pending.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp exec node scripts/check-data-release.ts

      # The tokenizer dictionary is bundled INTO each .vsix (unlike the JMdict DB, which is
      # downloaded on first run), so it must exist before packaging — package-platforms.ts refuses
      # to build without it.
      - name: Provision the tokenizer dictionary
        run: vp run build:tokenizer-dict

      # The regex engine behind comment highlighting (spec 18). `vscode-oniguruma` ships the .wasm
      # but does not embed it, so bundling the JS does not bring it along — it is copied into
      # assets/ and read at runtime like the tokenizer dictionary and the stroke SVGs. Gitignored,
      # so a runner has nothing until this runs, and without it the feature degrades silently to
      # "no comments" rather than failing loudly.
      - name: Provision the oniguruma WASM
        run: vp run build:onig-wasm

      # Bumpy runs the per-package build/publish commands from package.json's `bumpy` block:
      # package-platforms.ts builds one .vsix per target (each with its matching lindera-nodejs
      # native binary), then publish-vsix.ts publishes every target to the Marketplace + Open VSX.
      - run: vp dlx @varlock/bumpy ci release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
          # Personal access token for the VS Code Marketplace publisher.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          # Open VSX. Needed only until the extension exists there: a trusted publisher cannot be
          # registered for an extension with no published version, so the FIRST release has to use a
          # token. Once it is registered at open-vsx.org/user-settings/trusted-publishers, delete
          # this secret and `ovsx` switches to the OIDC exchange on its own.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          # Yarn 4 corrupts the tarball path Bumpy captures from stdout if
          # color codes are enabled. NO_COLOR alone is not enough for Yarn 4.
          NO_COLOR: "1"
          YARN_ENABLE_COLORS: "false"
